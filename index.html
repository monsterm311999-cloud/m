<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اتوماسیون تعاونی دانش بنیان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#14213d;--mu:#667085;--pr:#1f4e9c;--gold:#b8892b;--bd:#e1e7f0;--ok:#2e9e6b;--wa:#e08a1e;--er:#d64560;--hero:linear-gradient(135deg,#0f2a5c,#1f4e9c 60%,#2f7fb0);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16213a;--tx:#e8edf7;--mu:#98a4bd;--pr:#6aa0ff;--gold:#e0b04f;--bd:#26345a}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16213a;--tx:#e8edf7;--mu:#98a4bd;--pr:#6aa0ff;--gold:#e0b04f;--bd:#26345a}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px}
a{color:var(--pr)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:14px;padding:8px 16px;overflow-x:auto}
.top img{width:42px;height:42px;border-radius:50%}.top b{white-space:nowrap}
.top nav{display:flex;gap:4px;flex:1}.top nav a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--tx);white-space:nowrap}.top nav a:hover{background:var(--bg)}
.me{font-size:13px;color:var(--mu);white-space:nowrap}
.hero{background:var(--hero);color:#fff;text-align:center;padding:48px 16px 70px}
.hero img{width:150px;height:150px;border-radius:50%;border:4px solid var(--gold);background:#fff}
.hero h1{margin:14px 0 6px;font-size:30px;font-weight:800}.hero p{margin:0;opacity:.85}
.stats{max-width:900px;margin:-40px auto 10px;padding:0 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border-radius:14px;padding:14px;text-align:center;border:1px solid var(--bd);box-shadow:0 4px 14px #0001}.stat b{font-size:26px;color:var(--pr);display:block}.stat span{color:var(--mu);font-size:13px}
main{max-width:980px;margin:0 auto;padding:14px}
section{padding:18px 0}section h2{font-size:21px;margin:0 0 12px;display:flex;align-items:center;gap:10px}section h2:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent);transform:scaleX(-1)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}textarea{min-height:56px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
.btn{padding:9px 16px;border:0;border-radius:9px;background:var(--pr);color:#fff;font:inherit;cursor:pointer;font-weight:600}.btn.o{background:var(--ok)}
.btn.g{background:transparent;color:var(--er);border:1px solid var(--bd);padding:4px 10px;font-size:12px}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.t{font-weight:600}.m{color:var(--mu);font-size:12.5px;margin-top:3px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;color:#fff;margin-inline-start:4px}
.s-todo,.s-pending,.p-mid{background:var(--wa)}.s-doing,.s-accepted{background:var(--pr)}.s-done,.p-low{background:var(--ok)}.s-rejected,.p-high{background:var(--er)}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}.bar select{width:auto}
.dp{display:flex;gap:4px}.dp select{padding:9px 4px}
.empty{text-align:center;color:var(--mu);padding:22px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right}th{color:var(--mu);font-size:12px}
.lg{max-width:380px;margin:-40px auto 40px;text-align:center;position:relative}
footer{text-align:center;color:var(--mu);padding:26px;border-top:3px solid var(--gold);background:var(--card);margin-top:20px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:9px;display:none;z-index:9}
</style>
</head>

<div id="app"></div><div id="toast"></div>

function mkDb(){return {collection:c=>({
 onSnapshot(next,err){let on=true,last=null;const tick=async()=>{if(!on||document.hidden)return;try{const v=(await FJ(c))||{};const s=JSON.stringify(v);if(s!==last){last=s;next({docs:Object.entries(v).map(([id,d])=>({id,data:()=>d}))})}}catch(e){err&&err(e)}};tick();const iv=setInterval(tick,5000);pollers.push(tick);return()=>{on=false;clearInterval(iv)}},
 doc:id=>({set:d=>FJ(c+"/"+id,"PUT",d).then(refresh),update:d=>FJ(c+"/"+id,"PATCH",d).then(refresh),delete:()=>FJ(c+"/"+id,"DELETE").then(refresh)})})}}

const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open("dk",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>res(q.result);q.onerror=rej});
const idbSet=async(k,v)=>{const d=await idb();return new Promise(r=>{const t=d.transaction("k","readwrite");t.objectStore("k").put(v,k);t.oncomplete=r})};
const idbGet=async k=>{const d=await idb();return new Promise(r=>{const q=d.transaction("k").objectStore("k").get(k);q.onsuccess=()=>r(q.result)})};
const snapshotAll=async()=>JSON.stringify({app:"dk-automation",at:new Date().toISOString(),data:(await FJ(""))||{}},null,1);
async function wf(n,t){const f=await dirH.getFileHandle(n,{create:true}),w=await f.createWritable();await w.write(t);await w.close()}
async function initBackup(){bk(bkMsg||(canDir()?"پوشه‌ای انتخاب نشده است":"این مرورگر ذخیره‌ی خودکار در پوشه را پشتیبانی نمی‌کند (Chrome یا Edge روی کامپیوتر)؛ از دکمه‌ی دانلود استفاده کنید"));
 try{dirH=dirH||await idbGet("dir")}catch(e){}if(!dirH)return;
 if(await dirH.queryPermission({mode:"readwrite"})==="granted")backupNow(false,true);else{const g=$("#bkgrant");if(g)g.style.display=""}}
async function pickDir(){if(!canDir())return toast("مرورگر پشتیبانی نمی‌کند");try{dirH=await showDirectoryPicker({mode:"readwrite"});await idbSet("dir",dirH);backupNow(false,true)}catch(e){}}
async function grantDir(){try{if(await dirH.requestPermission({mode:"readwrite"})==="granted"){$("#bkgrant").style.display="none";backupNow(false,true)}}catch(e){}}
async function backupNow(manual,stamp){if(!S||S.role!=="admin")return;let txt;try{txt=await snapshotAll()}catch(e){return bk("خواندن داده‌ها از سرور ناموفق بود")}
 try{if(dirH&&(await dirH.queryPermission({mode:"readwrite"}))==="granted"){const d=new Date(),t=todayJ().replace(/\//g,"-");await wf("dk-backup-latest.json",txt);await wf("dk-backup-"+t+".json",txt);if(stamp)await wf("dk-backup-"+t+"-"+p2(d.getHours())+p2(d.getMinutes())+".json",txt);return bk("آخرین بک‌آپ در پوشه: "+d.toLocaleTimeString("fa-IR"))}}catch(e){bk("نوشتن در پوشه ناموفق بود")}
 if(manual)dlBackup(txt)}
async function dlBackup(txt){txt=typeof txt==="string"?txt:await snapshotAll();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download="dk-backup-"+todayJ().replace(/\//g,"-")+".json";document.body.appendChild(a);a.click();a.remove();bk("فایل بک‌آپ دانلود شد")}
function sched(){if(!S||S.role!=="admin"||!dirH)return;clearTimeout(bkTimer);bkTimer=setTimeout(()=>backupNow(false,false),15000)}
async function restoreFile(i){const f=i.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.data)throw 0;if(!confirm("همه‌ی داده‌های فعلی با این فایل جایگزین می‌شود. ادامه می‌دهید؟"))return;await FJ("","PUT",j.data);refresh();toast("بازیابی شد")}catch(e){toast("فایل بک‌آپ معتبر نیست")}i.value=""}
async function addTask(){const title=$("#t1").value.trim();if(!title)return toast("عنوان را بنویسید");
 const a=await attach($("#a1"));const ok=await save("tasks","t"+Date.now().toString(36),{title,to:$("#t2").value,pri:$("#t5").value,due:dpVal("t3"),desc:$("#t4").value.trim(),by:me,status:"todo",at:Date.now(),...a});
 if(ok){["t1","t4","a1"].forEach(i=>$("#"+i).value="");dpSet("t3","");toast("تسک ثبت شد")}}
async function addLetter(){const title=$("#l6").value.trim(),to=$("#l5").value.trim();if(!title||!to)return toast("عنوان و مخاطب لازم است");
 const a=await attach($("#a2"));const ok=await save("letters","l"+Date.now().toString(36),{no:$("#l1").value.trim(),kind:$("#l2").value,date:dpVal("l3"),from:$("#l4").value.trim(),to,title,by:me,at:Date.now(),...a});
 if(ok){["l5","l6","a2"].forEach(i=>$("#"+i).value="");autoNo=true;toast("نامه ثبت شد")}}
async function addReq(){const title=$("#r2").value.trim(),to=$("#r1").value;if(!title||!to)return toast("عنوان و گیرنده لازم است");
 const a=await attach($("#a3"));const ok=await save("requests","r"+Date.now().toString(36),{title,to,desc:$("#r3").value.trim(),from:me,status:"pending",at:Date.now(),...a});
 if(ok){["r2","r3","a3"].forEach(i=>$("#"+i).value="");toast("درخواست ارسال شد")}}
async function exportCsv(k){if(!dl)return toast("دانلود در دسترس نیست");
 const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
 const H=k==="letters"?[["شماره","no"],["عنوان","title"],["نوع","kind"],["فرستنده","from"],["مخاطب","to"],["تاریخ","date"]]:[["عنوان","title"],["مسئول","to"],["ثبت‌کننده","by"],["اولویت","pri"],["وضعیت","status"],["موعد","due"],["توضیحات","desc"]];
 const rows=D[k].map(r=>H.map(([,f])=>q(f==="pri"?PR[r.pri||"mid"]:f==="status"?ST[r.status]:(f==="date"||f==="due")&&r[f]?fa(r[f]):r[f])).join(","));
 try{await dl.save({filename:(k==="letters"?"letters":"tasks")+".csv",data:"\ufeff"+[H.map(h=>q(h[0])).join(","),...rows].join("\r\n")})}catch(e){if(e.code!=="declined")toast("خروجی گرفته نشد")}}
if(BASE){db=mkDb();listen()}
build();
</script>
</body>
